# Profile phu: chay thu nhanh khong can SQL Server
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Du lieu luu trong RAM, mat khi tat ung dung. Ban nop bai dung profile mac dinh (SQL Server).
spring.datasource.url=jdbc:h2:mem:vietgo;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create
spring.h2.console.enabled=false
