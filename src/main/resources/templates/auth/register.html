<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký tài khoản')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav(false)}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="auth-wrap">
    <aside th:replace="~{auth/_side :: side('Một tài khoản cho mọi chuyến đi', 'Lưu thông tin liên hệ để điền sẵn khi đặt vé, theo dõi vé đã mua và đặt lịch tư vấn.')}"></aside>

    <section class="auth-main">
        <div class="auth-card">
            <h1>Tạo tài khoản</h1>
            <p class="text-soft mb-4">Đã có tài khoản? <a th:href="@{/dang-nhap}" class="fw-semibold">Đăng nhập</a></p>

            <form th:action="@{/dang-ky}" th:object="${form}" method="post" data-loading novalidate>
                <div class="mb-3">
                    <label class="form-label" for="fullName">Họ và tên</label>
                    <div class="input-icon">
                        <i class="bi bi-person"></i>
                        <input class="form-control" type="text" th:field="*{fullName}" maxlength="100" autocomplete="name"
                               placeholder="Nguyễn Văn A" th:errorclass="is-invalid">
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label" for="email">Email</label>
                        <div class="input-icon">
                            <i class="bi bi-envelope"></i>
                            <input class="form-control" type="email" th:field="*{email}" maxlength="120" autocomplete="email"
                                   placeholder="ban@email.com" th:errorclass="is-invalid">
                        </div>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label" for="phone">Số điện thoại</label>
                        <div class="input-icon">
                            <i class="bi bi-phone"></i>
                            <input class="form-control" type="tel" th:field="*{phone}" maxlength="12" autocomplete="tel"
                                   placeholder="0912345678" th:errorclass="is-invalid">
                        </div>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <div class="input-icon">
                        <i class="bi bi-key"></i>
                        <input class="form-control" type="password" th:field="*{password}" autocomplete="new-password"
                               placeholder="Tối thiểu 8 ký tự" th:errorclass="is-invalid"
                               data-pw-meter="pwMeter" data-pw-rules="pwRules">
                        <button type="button" class="toggle-pass" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
                    </div>
                    <div class="pw-meter" id="pwMeter" data-score="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
                    <ul class="pw-rules" id="pwRules">
                        <li data-rule="len">8 ký tự trở lên</li>
                        <li data-rule="upper">Chữ hoa</li>
                        <li data-rule="lower">Chữ thường</li>
                        <li data-rule="digit">Chữ số</li>
                    </ul>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirmPassword">Nhập lại mật khẩu</label>
                    <div class="input-icon">
                        <i class="bi bi-key-fill"></i>
                        <input class="form-control" type="password" th:field="*{confirmPassword}" autocomplete="new-password"
                               placeholder="Nhập lại mật khẩu" th:errorclass="is-invalid">
                        <button type="button" class="toggle-pass" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" th:field="*{agree}" th:errorclass="is-invalid">
                    <label class="form-check-label" th:for="${#ids.prev('agree')}">Tôi đồng ý với điều khoản sử dụng và
                        <a href="/chinh-sach">chính sách hoàn hủy vé</a></label>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('agree')}" th:errors="*{agree}"></div>
                </div>
                <button class="btn btn-rail btn-lg w-100" type="submit">Tạo tài khoản</button>
            </form>
        </div>
    </section>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
