<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản trị · Chuyến tàu')}"></head>
<body class="no-foot-gap">
<nav th:replace="~{fragments/layout :: nav(false)}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="admin-shell">
    <aside th:replace="~{admin/_side :: side(${section})}"></aside>
    <main class="admin-main" data-kind="train">
        <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-3">
            <h1 class="h3 mb-0">Chuyến tàu</h1>
            <a class="btn btn-rail" th:href="@{/admin/tau-hoa/moi}"><i class="bi bi-plus-lg me-1"></i>Thêm chuyến tàu</a>
        </div>
        <form class="d-flex align-items-center gap-2 flex-wrap mb-3" th:action="@{/admin/tau-hoa}" method="get">
            <a class="btn btn-ghost btn-sm" th:href="@{/admin/tau-hoa(date=${day.minusDays(1)})}" aria-label="Ngày trước"><i class="bi bi-chevron-left"></i></a>
            <input class="form-control" type="date" name="date" th:value="${day}" style="max-width:190px" onchange="this.form.submit()" aria-label="Ngày khởi hành">
            <a class="btn btn-ghost btn-sm" th:href="@{/admin/tau-hoa(date=${day.plusDays(1)})}" aria-label="Ngày sau"><i class="bi bi-chevron-right"></i></a>
            <span class="text-soft small ms-2" th:text="${@fmt.weekday(day)} + ' · ' + ${#lists.size(trips)} + ' chuyến'">info</span>
        </form>
        <div class="panel">
            <div class="table-wrap">
                <table class="table-x">
                    <thead><tr><th>Tàu</th><th>Hành trình</th><th>Khởi hành</th><th>Đến</th><th>Cơ cấu toa</th><th>Đã bán</th><th>Trạng thái</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="t : ${trips}">
                        <td class="fw-bold" th:text="${t.trainCode}">SE1</td>
                        <td class="small"><div th:text="${t.originStation} + ' → ' + ${t.destinationStation}">A → B</div><div class="text-soft" th:text="${t.distanceKm} + ' km'">km</div></td>
                        <td class="small" th:text="${@fmt.dateTime(t.departureTime)}">t</td>
                        <td class="small" th:text="${@fmt.dateTime(t.arrivalTime)}">t</td>
                        <td class="small" th:text="${t.coachSummary}">2 ngồi mềm</td>
                        <td class="small" style="min-width:140px">
                            <div class="seat-meter mb-1"><span th:style="'width:' + ${sold[t.id] * 100 / t.capacity} + '%'"></span></div>
                            <span th:text="${sold[t.id]} + '/' + ${t.capacity}">0/0</span>
                        </td>
                        <td><span class="status" th:classappend="${t.active} ? 'status-paid' : 'status-expired'" th:text="${t.active} ? 'Mở bán' : 'Tạm dừng'">tt</span></td>
                        <td class="r text-nowrap">
                            <a class="btn btn-ghost btn-sm" th:href="@{/tau-hoa/chuyen/{id}(id=${t.id})}" title="Xem sơ đồ"><i class="bi bi-grid-3x3-gap"></i></a>
                            <a class="btn btn-ghost btn-sm" th:href="@{/admin/tau-hoa/{id}/sua(id=${t.id})}" title="Sửa"><i class="bi bi-pencil"></i></a>
                            <form class="d-inline" th:action="@{/admin/tau-hoa/{id}/trang-thai(id=${t.id})}" method="post"
                                  th:attr="data-confirm=${t.active} ? 'Tạm dừng bán chuyến ' + ${t.trainCode} + '?' : 'Mở bán lại chuyến ' + ${t.trainCode} + '?'">
                                <button class="btn btn-sm" th:classappend="${t.active} ? 'btn-danger-soft' : 'btn-ghost'" type="submit"
                                        th:title="${t.active} ? 'Tạm dừng bán' : 'Mở bán'"><i class="bi" th:classappend="${t.active} ? 'bi-pause-fill' : 'bi-play-fill'"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(trips)}"><td colspan="8" class="text-center text-soft py-4">Không có chuyến tàu trong ngày này.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
