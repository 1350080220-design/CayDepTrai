# =====================================================================
#  VietGo - Quan ly dat ve du lich (Ve tau hoa & Ve xe khach)
# =====================================================================
spring.application.name=VietGo
server.port=8080
server.servlet.session.timeout=60m
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ---------------------------------------------------------------------
#  SQL SERVER  (sua username/password cho khop may cua ban)
#  Database VietGoDB phai duoc tao truoc: chay file database/01_create_database.sql
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=VietGoDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate tu tao/cap nhat bang
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
# Luu chuoi duoi dang NVARCHAR de hien thi dung tieng Viet co dau
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ---------------------------------------------------------------------
#  Thymeleaf
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8

# ---------------------------------------------------------------------
#  Cau hinh nghiep vu
# ---------------------------------------------------------------------
# Tao du lieu mau (chuyen tau, chuyen xe, tai khoan) khi database con trong
app.seed.enabled=true
# So ngay tao lich chay mau tinh tu hom nay
app.seed.days=30

logging.level.org.hibernate.SQL=WARN
logging.level.com.vietgo=INFO
